name: SecGate Security Gate
description: Run SecGate security scanners (Semgrep, Gitleaks, osv-scanner, Trivy, npm audit) and optionally upload SARIF to GitHub Code Scanning.
author: Stelnyx

branding:
  icon: shield
  color: red

inputs:
  target:
    description: Directory to scan (relative to workspace root)
    required: false
    default: "."
  apply:
    description: Execute fixable remediations (npm audit fix)
    required: false
    default: "false"
  fail-on:
    description: Comma-separated severity levels that cause a non-zero exit (e.g. critical,high)
    required: false
    default: "critical,high"
  format:
    description: Output formats — comma-separated list of json, html, sarif
    required: false
    default: "json,html"
  require:
    description: Comma-separated scanners that must run (semgrep,gitleaks,npm,osv,trivy). Passed to the CLI as --require; the step fails with exit 2 if one did not run. Empty uses the CLI default (requireScanners from the config file).
    required: false
    default: ""
  secgate-path:
    description: Path to a local secgate.js to run instead of the published npm package (used by this repo's own CI to scan the code under test)
    required: false
    default: ""

outputs:
  report-path:
    description: Path to the JSON report file (secgate-v7-report.json)
    value: ${{ steps.run-secgate.outputs.report-path }}
  sarif-path:
    description: Path to the SARIF 2.1.0 report file (only set when format includes sarif)
    value: ${{ steps.run-secgate.outputs.sarif-path }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: "22"

    - name: Run SecGate
      id: run-secgate
      shell: bash
      env:
        SECGATE_TARGET: ${{ inputs.target }}
        SECGATE_APPLY: ${{ inputs.apply }}
        SECGATE_FORMAT: ${{ inputs.format }}
        SECGATE_FAIL_ON: ${{ inputs.fail-on }}
        SECGATE_REQUIRE: ${{ inputs.require }}
        SECGATE_PATH: ${{ inputs.secgate-path }}
      run: |
        ARGS=("$SECGATE_TARGET")
        if [ "$SECGATE_APPLY" = "true" ]; then
          ARGS+=("--apply")
        fi
        ARGS+=("--format" "$SECGATE_FORMAT")
        if [ -n "$SECGATE_REQUIRE" ]; then
          ARGS+=("--require" "$SECGATE_REQUIRE")
        fi

        TARGET_ABS="$(realpath "$SECGATE_TARGET")"
        REPO_NAME="$(basename "$TARGET_ABS")"

        # Start clean: an old report must not decide the result of a CLI that
        # died before writing a new one. Also ignore a job-level SECGATE_EXIT.
        rm -f secgate-v7-report.json
        SECGATE_EXIT=0

        if [ -n "$SECGATE_PATH" ]; then
          echo "Running local SecGate: node $SECGATE_PATH ${ARGS[*]}"
          node "$SECGATE_PATH" "${ARGS[@]}" || SECGATE_EXIT=$?
        else
          # "@latest" forces the registry package; a bare name resolves to the
          # caller's own project when it is named @stelnyx/secgate (exit 127).
          npx --yes @stelnyx/secgate@latest "${ARGS[@]}" || SECGATE_EXIT=$?
        fi

        echo "report-path=secgate-v7-report.json" >> "$GITHUB_OUTPUT"

        if echo "$SECGATE_FORMAT" | grep -q "sarif"; then
          echo "sarif-path=${REPO_NAME}.sarif.json" >> "$GITHUB_OUTPUT"
        fi

        # Exit 2 means the scan was not a pass: INCOMPLETE, no scanner ran, a
        # --require'd scanner did not run, or a usage error. The fail-on filter
        # below only looks at findings, so it must never override that. Any
        # other code above 1 (e.g. 127 command not found, 137 killed) is a
        # crash and is kept too.
        if [ "${SECGATE_EXIT:-0}" -gt 1 ]; then
          echo "::error::SecGate exited with code $SECGATE_EXIT (2 = incomplete scan, no scanner ran, or a required scanner did not run, or a usage/config error)"
          exit "$SECGATE_EXIT"
        fi

        # Apply fail-on filter: only exit non-zero for configured severities.
        if [ -f secgate-v7-report.json ]; then
          IFS=',' read -ra LEVELS <<< "$SECGATE_FAIL_ON"
          BLOCK=0
          for level in "${LEVELS[@]}"; do
            LEVEL_UPPER="$(echo "$level" | tr '[:lower:]' '[:upper:]' | tr -d ' ')"
            LEVEL_LOWER="$(echo "$LEVEL_UPPER" | tr '[:upper:]' '[:lower:]')"
            # Skip empty items (e.g. a trailing comma).
            if [ -z "$LEVEL_LOWER" ]; then
              continue
            fi
            # The level is data: allowlist it, then pass it as an argument,
            # never as JavaScript source.
            case "$LEVEL_LOWER" in
              critical|high|medium|low|unknown) ;;
              *)
                echo "::error::Invalid fail-on level '${LEVEL_LOWER//[^a-z0-9_-]/?}' (allowed: critical, high, medium, low, unknown)"
                exit 2
                ;;
            esac
            COUNT="$(node -e "const r=JSON.parse(require('fs').readFileSync('secgate-v7-report.json'));console.log(r.summary[process.argv[1]]||0)" "$LEVEL_LOWER")"
            if [ "$COUNT" -gt 0 ]; then
              BLOCK=1
              echo "::error::SecGate found $COUNT $LEVEL_UPPER finding(s)"
            fi
          done
          exit $BLOCK
        fi

        exit "${SECGATE_EXIT:-0}"
