# Example workflow: SecGate security gate with SARIF upload and artifact archival.
#
# Usage in your own repository:
#   uses: Stelnyx/SecGate/.github/actions/secgate@main
#
# For a pinned SHA (recommended for production):
#   uses: Stelnyx/SecGate/.github/actions/secgate@<full-sha>

name: SecGate Security Gate (example)

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  secgate:
    name: Security Gate
    runs-on: ubuntu-latest
    permissions:
      # Required for uploading SARIF results to GitHub Code Scanning.
      security-events: write
      # Required to check out the repository.
      contents: read
      # Required to post PR comments (optional).
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Install the external scanners at the versions pinned in this repo.
      # SecGate skips any tool that is not on PATH. In your own repository,
      # install the scanners you need (see README) instead of this local action.
      - name: Install external scanners
        uses: ./.github/actions/install-scanners

      # Run SecGate — emits JSON, HTML, and SARIF.
      # This repository uses the action at the same commit; in your own
      # repository use Stelnyx/SecGate/.github/actions/secgate@<full-sha>.
      - name: Run SecGate
        id: secgate
        uses: ./.github/actions/secgate
        with:
          target: "."
          apply: "false"
          fail-on: "critical,high"
          format: "json,html,sarif"

      # Upload HTML + JSON as build artifacts (always, even on failure).
      - name: Upload HTML + JSON report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secgate-report-${{ github.run_number }}
          path: |
            secgate-v7-report.json
            *.html
          retention-days: 30

      # Upload SARIF to GitHub Code Scanning.
      # Requires security-events: write permission and Code Scanning enabled on the repo.
      - name: Upload SARIF to Code Scanning
        if: always() && steps.secgate.outputs.sarif-path != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.secgate.outputs.sarif-path }}
          category: secgate
