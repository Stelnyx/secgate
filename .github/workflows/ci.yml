name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install dev dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install external scanners
        uses: ./.github/actions/install-scanners

      - name: Run tests with coverage
        run: npm run test:coverage

  self-scan:
    name: Self-scan via bundled action
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install npm dependencies
        run: npm ci

      - name: Install external scanners
        uses: ./.github/actions/install-scanners

      - name: Run SecGate (self-scan of the checkout)
        id: secgate
        uses: ./.github/actions/secgate
        with:
          target: "."
          fail-on: "critical,high"
          format: "json,html"
          secgate-path: "./secgate.js"

      - name: Upload self-scan report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secgate-self-scan-${{ github.run_number }}
          path: |
            secgate-v7-report.json
            *.html
          retention-days: 30
